services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      # Mount cert directory when OCI bridge is configured:
      # - ./mosquitto/certs:/mosquitto/certs

  device-a:
    build:
      context: ./devices
    command: python device_a.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_TOPIC: devices/device-a/telemetry
      PUBLISH_INTERVAL: "5"
    depends_on:
      - mosquitto
    restart: on-failure

  device-b:
    build:
      context: ./devices
    command: python device_b.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_TOPIC: devices/device-b/telemetry
      PUBLISH_INTERVAL: "5"
    depends_on:
      - mosquitto
    restart: on-failure
