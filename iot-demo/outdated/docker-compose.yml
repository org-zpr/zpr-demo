services:
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  device-a:
    build:
      context: ./devices
    command: python device_a.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: devices/device-a/telemetry
      PUBLISH_INTERVAL: "5"
    depends_on:
      - mosquitto
    restart: on-failure

  device-b:
    build:
      context: ./devices
    command: python device_b.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "1883"
      MQTT_TOPIC: devices/device-b/telemetry
      PUBLISH_INTERVAL: "5"
    depends_on:
      - mosquitto
    restart: on-failure
