services:
  egress:
    build: .
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      TZ: UTC
      # OCI IoT bridge credentials — read from setup/egress/.env (gitignored),
      # which is populated from `tofu output` via ./gen-env.sh.
      OCI_DEVICE_HOST: ${OCI_DEVICE_HOST:-}
      OCI_DEVICE_USERNAME: ${OCI_DEVICE_USERNAME:-}
      OCI_DEVICE_PASSWORD: ${OCI_DEVICE_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # A laptop debug build of ph — this adapter runs in local Docker, not on OL9.
      # ZPR_CORE_SRC comes from .env too (gen-env.sh copies it out of sources.env).
      - ${ZPR_CORE_SRC:?set ZPR_CORE_SRC — run ./gen-env.sh}/target/debug/ph:/app/ph:ro
      - ../:/certs:ro
      - ./adapter-conf.toml:/app/adapter-conf.toml:ro
    networks:
      zpr-egress:
        ipv4_address: 172.30.0.10

networks:
  zpr-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
