# zpr-dashboard settings. The tool has no --config flag: it reads "config.toml"
# from its working directory (internal/config/config.go) and fails if it is
# absent. local-compute/deploy-docker.sh installs this file as
# local-compute/conf/vs/config.toml, i.e. /conf/config.toml inside the vs
# container, and commands/demo-zpr-dashboard runs it there with -w /conf.
#
# Any ZPR_* env var already set on the process WINS over the value here
# (config.go setenv() skips keys already in the environment). That is how
# demo-zpr-dashboard passes the API key: -e ZPR_API_KEY.

[dataplane]
base_url = "https://[fd5a:5052::1]:8182" # well known VS Server URL
timeout = "30s"                     # Default Timeout

# Relative to this file
[files]
ca = "include/admin-tls-cert.pem" # CA Certificate of VS Server
# key: unused here. demo-zpr-dashboard passes the key inline as ZPR_API_KEY, so
# dataplane.NewDefault() never reads a key file and client.key stays on the host
# (same as commands/demo-vs-admin). Uncomment to read it from a file instead:
# key = "include/client.key"   # API Key (created with vsapikey)

[ui]
show_static = false
