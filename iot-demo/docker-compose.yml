services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/certs:/mosquitto/certs

  device-a:
    build:
      context: ./devices
    command: python device_a.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "8883"
      MQTT_TOPIC: devices/device-a/telemetry
      MQTT_CA_CERT: /certs/ca.crt
      PUBLISH_INTERVAL: "5"
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - mosquitto
    restart: on-failure

  device-b:
    build:
      context: ./devices
    command: python device_b.py
    environment:
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: "8883"
      MQTT_TOPIC: devices/device-b/telemetry
      MQTT_CA_CERT: /certs/ca.crt
      PUBLISH_INTERVAL: "5"
    volumes:
      - ./mosquitto/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - mosquitto
    restart: on-failure
