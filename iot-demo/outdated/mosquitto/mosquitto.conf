# connection oci-iot-bridge-device-a
# address <oci-mqtt-endpoint>:8883
# topic devices/device-a/telemetry out 0
# bridge_cafile /mosquitto/certs/ca.pem
# bridge_certfile /mosquitto/certs/device-a.crt
# bridge_keyfile /mosquitto/certs/device-a.key
# bridge_tls_version tlsv1.2
