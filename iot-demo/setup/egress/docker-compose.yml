services:
  egress:
    build: .
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      TZ: UTC
      # OCI IoT bridge credentials — read from setup/egress/.env (gitignored),
      # which is populated from `tofu output` via ./gen-env.sh.
      OCI_DEVICE_HOST: ${OCI_DEVICE_HOST:-}
      OCI_DEVICE_USERNAME: ${OCI_DEVICE_USERNAME:-}
      OCI_DEVICE_PASSWORD: ${OCI_DEVICE_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /home/othomas/zpr/core/target/debug/ph:/app/ph:ro
      - /home/othomas/zpr/demo/iot-demo/setup:/certs:ro
      - ./adapter-conf.toml:/app/adapter-conf.toml:ro
    networks:
      zpr-egress:
        ipv4_address: 172.30.0.10

networks:
  zpr-egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
